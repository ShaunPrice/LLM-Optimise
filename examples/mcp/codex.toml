# Replace paths. This file is an example, not an installed client configuration.
[mcp_servers.llm-optimise]
command = "/absolute/path/to/LLM-Optimise/.venv/bin/python"
args = ["-m", "llm_optimise.mcp_server", "--workspace", "/absolute/path/to/LLM-Optimise", "--runtime", "/absolute/path/to/llama-server"]

