[build-system]
requires = ["hatchling>=1.26,<2"]
build-backend = "hatchling.build"

[project]
name = "llm-optimise"
version = "0.1.1"
description = "Find the measured speed, memory and quality frontier of local specialised LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["psutil>=6,<8"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]
mcp = ["mcp>=1.28,<2", "PyJWT[crypto]>=2.10,<3"]

[project.scripts]
llm-optimise = "llm_optimise.cli:main"
llm-optimise-mcp = "llm_optimise.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/llm_optimise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
