[package]
name = "llm-optimise-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
llm-optimise-supervisor = { path = "../../native" }

[profile.release]
lto = "thin"
strip = true
