name: Validate application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install ".[dev]"
      - run: ruff check src tests
      - run: ruff format --check src tests
      - run: node --check src/llm_optimise/static/app.js
      - run: node --check src/llm_optimise/static/workbench.js
      - run: pytest -q
      - run: python -m build --wheel
      - run: llm-optimise --help
      - run: python -c "from importlib.resources import files; p=files('llm_optimise'); assert (p/'static'/'app-icon.png').is_file(); assert (p/'data'/'tasks.jsonl').is_file()"
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
          components: rustfmt, clippy
      - run: cargo fmt --manifest-path native/Cargo.toml --check
      - run: cargo clippy --locked --manifest-path native/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path native/Cargo.toml
      - run: cargo build --locked --release --manifest-path native/Cargo.toml
      - run: python -m pip install ".[dev]"
      - run: pytest tests/test_native_runtime.py tests/test_lifecycle.py -q
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: cargo check --locked --manifest-path desktop/src-tauri/Cargo.toml
  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llm-optimise:ci .
      - run: docker run --rm --network none --memory 128m --cpus 1 llm-optimise:ci --help
